name: Android CI

on:
  push:
    branches: [ main, 'release/1.0.0-full-app' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  AWAREX_KEYSTORE_B64: ${{ secrets.AWAREX_KEYSTORE_B64 }}
  AWAREX_KEYSTORE_PASSWORD: ${{ secrets.AWAREX_KEYSTORE_PASSWORD }}
  AWAREX_KEY_ALIAS: ${{ secrets.AWAREX_KEY_ALIAS }}
  AWAREX_KEY_PASSWORD: ${{ secrets.AWAREX_KEY_PASSWORD }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AWAREX-1.0.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Materialize persistent signing key
        if: ${{ env.AWAREX_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$AWAREX_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/awarex-release.jks"
          test -s "$RUNNER_TEMP/awarex-release.jks"
          echo "AWAREX_KEYSTORE_PATH=$RUNNER_TEMP/awarex-release.jks" >> "$GITHUB_ENV"

      - name: Build persistent signed release APK
        if: ${{ env.AWAREX_KEYSTORE_B64 != '' }}
        run: gradle --no-daemon assembleRelease

      - name: Verify persistent signed release APK
        if: ${{ env.AWAREX_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload persistent signed release APK
        if: ${{ env.AWAREX_KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AWAREX-1.0.0-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
